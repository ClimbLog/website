<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />

  <title>ClimbLog</title>
  <meta name="description" content="ClimbLog - your flights, logged and shared." />
  <meta name="theme-color" content="#110C52" />

  <!-- This page also serves every /u/{username} friend invite, so the social
       card matters here: a shared climblog.co/u/name link unfurls with these. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ClimbLog" />
  <meta property="og:title" content="Join me on ClimbLog" />
  <meta property="og:description" content="ClimbLog is a personal flight log. Track every flight, build your route map, and share your Flight Passport." />
  <meta property="og:image" content="https://climblog.co/assets/img/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Join me on ClimbLog" />
  <meta name="twitter:description" content="ClimbLog is a personal flight log. Track every flight, build your route map, and share your Flight Passport." />
  <meta name="twitter:image" content="https://climblog.co/assets/img/og.png" />

  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />

  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/site.css" />

  <style>
    /* Passport indigo throughout - this is the share-link landing page. */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cl-passport-gradient);
      background-attachment: fixed;
      color: #fff;
    }

    .invite-nav {
      padding: var(--cl-space-lg) 0;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: var(--cl-space-3xl) var(--cl-space-xl);
    }

    .invite-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--cl-radius-xl);
      padding: var(--cl-space-3xl) var(--cl-space-xl);
      box-shadow: 0 30px 70px rgba(0,0,0,0.35);
    }

    .invite-card.hidden { display: none; }

    .invite-plane {
      width: 58px; height: 58px;
      margin: 0 auto var(--cl-space-lg);
      display: grid; place-items: center;
      border-radius: var(--cl-radius-full);
      background: rgba(255,200,64,0.12);
      border: 1px solid rgba(255,200,64,0.42);
      color: var(--cl-passport-gold);
    }

    .invite-username {
      font-size: var(--cl-text-2xl);
      font-weight: 800;
      letter-spacing: var(--cl-tracking-tight);
      margin-bottom: var(--cl-space-xs);
      word-break: break-all;
    }

    .invite-line {
      color: rgba(255,255,255,0.66);
      margin-bottom: var(--cl-space-2xl);
    }

    .invite-card .btn {
      width: 100%;
      margin-bottom: var(--cl-space-md);
    }

    .invite-card .btn-primary {
      background: var(--cl-passport-gold);
      border-color: var(--cl-passport-gold);
      color: #0F0F2D;
    }
    .invite-card .btn-primary:hover {
      background: var(--cl-passport-route);
      border-color: var(--cl-passport-route);
      color: #0F0F2D;
    }

    .invite-card .btn-ghost {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.26);
      color: #fff;
    }
    .invite-card .btn-ghost:hover { background: rgba(255,255,255,0.16); color: #fff; }

    .invite-after {
      margin-top: var(--cl-space-lg);
      font-size: var(--cl-text-sm);
      color: rgba(255,255,255,0.5);
    }
    .invite-after b { color: rgba(255,255,255,0.78); }

    .notfound-title {
      font-size: var(--cl-text-2xl);
      font-weight: 800;
      letter-spacing: var(--cl-tracking-tight);
      margin-bottom: var(--cl-space-sm);
    }
    .notfound-line { color: rgba(255,255,255,0.66); margin-bottom: var(--cl-space-2xl); }

    .invite-footer {
      padding: var(--cl-space-xl) 0;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.10);
      font-size: var(--cl-text-sm);
    }
    .invite-footer a {
      color: rgba(255,255,255,0.62);
      text-decoration: none;
      margin: 0 var(--cl-space-md);
    }
    .invite-footer a:hover { color: #fff; }
  </style>
</head>
<body>

  <nav class="invite-nav">
    <div class="container">
      <a href="/" class="nav-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <g transform="translate(12,12) scale(0.875) translate(-12,-12)">
          <path d="M21.0654 6.707c-1.4648-.7451-3.5078-.748-5.4658-.002-.0283.0107-.0566.0215-.084.0332L8.3398 3.7656C7.3447 3.3535 6.2188 3.3896 5.25 3.8682L4.7334 4.124c-.541.2676-.8975.7852-.9551 1.3857-.0566.6006.1963 1.1777.6777 1.542l4.3994 3.3301c-.3447.25-.6641.4941-.9629.7354L7.5215 11.417c-1.2012-.6416-2.6357-.6748-3.8877-.0557L2.9297 11.71c-.5391.2656-.918.7559-1.0391 1.3447-.1211.5879.0322 1.1875.4199 1.6445L4.125 16.835l.0254.0518c.1738.3496.5264.5547.8955.5547.126 0 .2529-.0234.375-.0732l1.583-.6406c4.7412-1.9199 9.3799-4.2139 13.79-6.8184.7295-.4316 1.1689-1.1396 1.1465-1.8467C21.9219 7.4834 21.5947 6.9775 21.0654 6.707zM8.2422 19.9697c2.459-.6133 5.0566-.6133 7.5156 0C15.8389 19.9902 15.9209 20 16.001 20c.4482 0 .8555-.3027.9688-.7578.1348-.5352-.1914-1.0781-.7275-1.2119-2.7754-.6953-5.709-.6953-8.4844 0-.5361.1338-.8623.6768-.7275 1.2119C7.1631 19.7783 7.707 20.1025 8.2422 19.9697z"/>
        </g>
      </svg>
        ClimbLog
      </a>
    </div>
  </nav>

  <main>
    <!-- Friend invite (rendered for /u/{username} paths) -->
    <div class="invite-card hidden" id="invite">
      <div class="invite-plane">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      </div>
      <div class="invite-username" id="invite-username">@username</div>
      <div class="invite-line">wants to be friends on ClimbLog</div>

      <a class="btn btn-primary store-btn" data-store="ios" data-store-label="Download on the">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span><small data-store-note>Coming soon to</small><b>App Store</b></span>
      </a>

      <a class="btn btn-ghost store-btn" data-store="android" data-store-label="Get it on">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#00A0FF" d="M1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924z"/><path fill="#00E676" d="M13.544 10.989l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973z"/><path fill="#FFCE00" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594z"/><path fill="#FF3A44" d="M13.544 13.056l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span><small data-store-note>Coming soon to</small><b>Google Play</b></span>
      </a>

      <div class="invite-after">After installing, add <b id="invite-after-username">@username</b> from the Friends tab</div>
    </div>

    <!-- Plain 404 for anything else -->
    <div class="invite-card hidden" id="notfound">
      <div class="notfound-title">Page not found</div>
      <div class="notfound-line">The page you are looking for does not exist.</div>
      <a href="/" class="btn btn-primary">Back to ClimbLog</a>
    </div>
  </main>

  <footer class="invite-footer">
    <div class="container">
      <a href="/">Home</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
      <a href="/support.html">Support</a>
    </div>
  </footer>

  <script>
    // GitHub Pages 404 trick: this one static page renders every /u/{username}
    // invite. No backend, no profile data served — the username in the URL is
    // all the page ever shows (zero enumeration surface).
    (function () {
      var match = window.location.pathname.match(/^\/u\/([A-Za-z0-9_]{3,20})\/?$/);
      if (match) {
        var username = '@' + match[1].toLowerCase();
        // textContent only — never inject URL content as HTML.
        document.getElementById('invite-username').textContent = username;
        document.getElementById('invite-after-username').textContent = username;
        document.title = username + ' on ClimbLog';
        document.getElementById('invite').classList.remove('hidden');
      } else {
        document.getElementById('notfound').classList.remove('hidden');
      }
    })();
  </script>

  <script src="/assets/js/site.js"></script>
</body>
</html>
