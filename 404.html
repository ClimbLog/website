<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ClimbLog</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1B3A6B;
      --sky: #3A7FD5;
      --sky-light: #EBF2FC;
      --accent: #E8A020;
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --text: #1E2D45;
      --muted: #5A6A80;
      --border: #D6E1EE;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: var(--navy);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .invite-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(27,58,107,0.08);
      padding: 2.6rem 2rem 2.2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .invite-plane {
      width: 56px;
      height: 56px;
      background: var(--sky-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.4rem;
      color: var(--sky);
    }

    .invite-username {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--navy);
      word-break: break-all;
    }

    .invite-line {
      color: var(--muted);
      margin: 0.35rem 0 1.8rem;
    }

    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      border-radius: var(--radius);
      padding: 12px 22px;
      font-size: 0.92rem;
      font-weight: 600;
      margin: 0 auto 0.7rem;
      max-width: 280px;
      transition: opacity 0.2s;
    }

    .store-btn:hover { opacity: 0.9; }
    .store-btn.primary { background: var(--navy); color: #fff; }
    .store-btn.secondary { background: var(--sky); color: #fff; }
    .store-btn svg { flex-shrink: 0; }

    .invite-after {
      margin-top: 1.4rem;
      background: var(--sky-light);
      color: var(--sky);
      border-radius: var(--radius);
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .invite-after b { word-break: break-all; }

    /* Plain 404 (non-/u/ paths) */
    .notfound-title {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }

    .notfound-line { color: var(--muted); margin-bottom: 1.8rem; }

    .hidden { display: none; }

    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.55);
      padding: 1.6rem 2rem;
      text-align: center;
      font-size: 0.82rem;
    }

    footer a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      margin: 0 0.6rem;
    }

    footer a:hover { color: #fff; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.69a16 16 0 0 0 6 6l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      ClimbLog
    </a>
  </nav>

  <main>
    <!-- Friend invite (rendered for /u/{username} paths) -->
    <div class="invite-card hidden" id="invite">
      <div class="invite-plane">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      </div>
      <div class="invite-username" id="invite-username">@username</div>
      <div class="invite-line">wants to be friends on ClimbLog</div>
      <a href="#" class="store-btn primary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Download on the App Store
      </a>
      <a href="#" class="store-btn secondary">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.76c.3.17.64.24.99.19l12.47-7.19-2.66-2.76-10.8 9.76zM20.49 10.56L17.6 8.86l-3.01 2.93 3.01 3.11 2.91-1.69a1.9 1.9 0 0 0 0-3.31-.26-.15-.03-.34zM2.18.26a2.06 2.06 0 0 0-.18.85v21.78c0 .31.07.6.18.85l.09.08 12.2-12.2v-.29L2.27.18l-.09.08zM16.14 14.05L3.67 21.24l-.09.07.49.43 12.47-7.19-2.66-2.76 2.26 2.26z"/></svg>
        Get it on Google Play
      </a>
      <div class="invite-after">After installing, add <b id="invite-after-username">@username</b> from the Friends tab</div>
    </div>

    <!-- Plain 404 for anything else -->
    <div class="invite-card hidden" id="notfound">
      <div class="notfound-title">Page not found</div>
      <div class="notfound-line">The page you're looking for doesn't exist.</div>
      <a href="/" class="store-btn primary">Back to ClimbLog</a>
    </div>
  </main>

  <footer>
    <a href="/">Home</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/terms.html">Terms</a>
    <a href="/support.html">Support</a>
  </footer>

  <script>
    // GitHub Pages 404 trick: this one static page renders every /u/{username}
    // invite. No backend, no profile data served — the username in the URL is
    // all the page ever shows (zero enumeration surface).
    (function () {
      var match = window.location.pathname.match(/^\/u\/([A-Za-z0-9_]{3,20})\/?$/);
      if (match) {
        var username = '@' + match[1].toLowerCase();
        // textContent only — never inject URL content as HTML.
        document.getElementById('invite-username').textContent = username;
        document.getElementById('invite-after-username').textContent = username;
        document.title = username + ' on ClimbLog';
        document.getElementById('invite').classList.remove('hidden');
      } else {
        document.getElementById('notfound').classList.remove('hidden');
      }
    })();
  </script>

</body>
</html>
